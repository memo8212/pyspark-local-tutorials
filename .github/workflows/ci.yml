name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate sample data
        run: python common/data.py

      - name: Syntax check
        run: python -m py_compile common/*.py tutorials/*.py run_all.py

      - name: Unit tests
        run: pytest -q

      - name: Run a few tutorials
        run: python run_all.py 01 02 03 06 09 13
